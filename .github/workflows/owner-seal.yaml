name: Owner Seal

# The required owner-seal check (docs/specs/release-ceremony): a ready pull
# request passes only with a valid open-seal beneath its head and a valid
# merge-seal at its head. A draft passes without seals. KEYS and the
# verifier come from the default branch, never from the pull request head,
# so a candidate tree cannot vouch for itself. The head enters as fetched
# history only. The ruleset in .github/rulesets/ceremony-base.json names
# this check as required next to quality. Body edits re-run the check
# because the open-seal nonce lives in the body.
on:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]

permissions: {}

concurrency:
    group: owner-seal-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    seal:
        name: owner-seal
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Draft
              if: github.event.pull_request.draft
              run: echo "draft, seals not required yet"

            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              if: '!github.event.pull_request.draft'
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify the seals
              if: '!github.event.pull_request.draft'
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  # The verifier and KEYS are the default branch's; a
                  # mismatch here means the checkout is not the trusted one.
                  checked_out=$(git rev-parse HEAD)
                  trusted=$(git rev-parse "origin/$DEFAULT_BRANCH")
                  [ "$checked_out" = "$trusted" ] \
                      || { echo "the trusted checkout $checked_out is not $DEFAULT_BRANCH at $trusted"; exit 1; }
                  git fetch --quiet origin "pull/$PR_NUMBER/head"
                  git cat-file -e "$HEAD_SHA^{commit}" \
                      || { echo "the pull request head $HEAD_SHA was not fetched; rerun the check"; exit 1; }
                  git cat-file -e "$BASE_SHA^{commit}" || git fetch --quiet origin "$BASE_SHA"
                  # Every open pull request body, so the nonce check can
                  # count holders. Pages merge through jq -s.
                  gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" \
                      --jq '[.[] | {number, body}]' | jq -s 'add // []' > "$RUNNER_TEMP/open-bodies.json" \
                      || { echo "could not read the open pull requests; rerun the check"; exit 1; }
                  bash scripts/verify-seal open \
                      --head "$HEAD_SHA" --repo "$REPOSITORY" --base "$BASE_REF" --number "$PR_NUMBER" \
                      --keys KEYS --open-bodies "$RUNNER_TEMP/open-bodies.json" --since "$BASE_SHA"
                  # The ledger is the controller's last `ledger:` comment on
                  # the pull request, a JSON object on that first line. Without
                  # one the merge-seal's generation goes unchecked and the
                  # verifier says so.
                  ledger_args=()
                  ledger=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
                      --jq '[.[] | select(.user.login == "runeseer[bot]") | .body | split("\n") | first | select(startswith("ledger: ")) | ltrimstr("ledger: ")]' \
                      | jq -s -r 'add // [] | last // ""') \
                      || { echo "could not read the pull request comments; rerun the check"; exit 1; }
                  if [ -n "$ledger" ]; then
                      printf '%s\n' "$ledger" > "$RUNNER_TEMP/ledger.json"
                      ledger_args=(--ledger "$RUNNER_TEMP/ledger.json")
                  fi
                  bash scripts/verify-seal merge --head "$HEAD_SHA" --keys KEYS ${ledger_args[@]+"${ledger_args[@]}"}
