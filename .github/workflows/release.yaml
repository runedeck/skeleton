name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Signed tag to publish"
                required: true

permissions:
    contents: write
    pull-requests: read

concurrency:
    group: release-${{ inputs.tag }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # Verification policy and trusted keys come from protected main,
            # never from the tag whose trust is still being established.
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: main

            - id: tag
              name: Verify release tag
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  bash scripts/verify-release-tag "$RELEASE_TAG"
                  echo "object=$(git rev-parse "refs/tags/$RELEASE_TAG^{tag}")" >> "$GITHUB_OUTPUT"

            - name: Check out verified tag
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  git checkout --detach "refs/tags/$RELEASE_TAG^{}"
                  git clean -ffd

            - name: Compile release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag }}
              run: bash scripts/compile-release-notes "$RELEASE_TAG" > release-notes.md

            - name: Publish release
              env:
                  EXPECTED_TAG_OBJECT: ${{ steps.tag.outputs.object }}
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  remote_object=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)
                  [ "$remote_object" = "$EXPECTED_TAG_OBJECT" ] || {
                      printf 'fatal: remote %s changed after verification\n' "$RELEASE_TAG" >&2
                      exit 1
                  }
                  gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
