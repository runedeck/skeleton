name: Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Specification validation joins this job once runedeck/cli
            # publishes a release for setup-rune to install.
            - name: Shellcheck template hooks
              run: |
                  sudo apt-get install -y shellcheck
                  shellcheck -S warning templates/base/.githooks/*
