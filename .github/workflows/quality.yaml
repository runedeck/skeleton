name: Quality

# Two runs, two facts. The push run proves the head commit: it is the
# green-head signal Draft Open and the review controller re-enter on, and
# its log is the receipt `rune sign submit` carries. The merge_group run
# proves the merge the queue is about to make, and the ruleset requires it.
# There is no pull_request run: GitHub builds that merge commit once and
# never rebuilds it when the base moves, so its verdict is about a tree
# nobody can inspect (runedeck/cli #67, 2026-09-21). The queue's temporary
# branches are proven by the merge_group run alone.
on:
    push:
        branches-ignore:
            - "gh-readonly-queue/**"
    merge_group:
        types: [checks_requested]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  # The prek hooks execute code from the checked-out tree, which
                  # must never find a usable token in the git config.
                  persist-credentials: false

            # Specification validation joins this job once runedeck/cli
            # publishes a release for setup-rune to install.
            - name: Shellcheck template hooks
              run: |
                  sudo apt-get install -y shellcheck
                  find templates/base/.githooks .githooks -type f ! -name '*.py' -exec shellcheck -S warning {} +

            - name: Test worktree cleanup
              run: bash tests/worktree-done

            - name: Test the seal verifier
              run: bash tests/verify-seal

            - name: Test the direct-push signature verifier
              run: bash tests/verify-range-signatures

            - name: Test the trusted-key resolver
              run: bash tests/trusted-keys

            - name: Test model attribution
              run: python3 -m unittest discover -s tests -p 'test_auth*.py' -v

            - name: Install review configuration test dependency
              env:
                  PIP_DISABLE_PIP_VERSION_CHECK: "1"
              run: python3 -m pip install PyYAML==6.0.3

            - name: Test optional review configuration
              run: python3 -m unittest discover -s tests -p 'test_review_configuration.py' -v

            - name: Test the canary contract
              run: python3 -m unittest discover -s tests -p 'test_canary_contract.py' -v

            - name: Test the tool installer contract
              run: python3 -m unittest discover -s tests -p 'test_tool_install.py' -v

            - name: Test the dcg command policy contract
              run: python3 -m unittest discover -s tests -p 'test_dcg_policy.py' -v

            - name: Test the trash script
              run: python3 -m unittest discover -s tests -p 'test_trash.py' -v

            - name: Test the consumer parity audit
              run: python3 -m unittest discover -s tests -p 'test_consumer_parity.py' -v

            - name: Install JJ for push gate tests
              env:
                  JJ_VERSION: "0.45.1"
                  JJ_SHA256: "f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72"
              run: |
                  scratch=$(mktemp -d)
                  curl -fsSL -o "$scratch/jj.tar.gz" "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
                  printf '%s  %s\n' "$JJ_SHA256" "$scratch/jj.tar.gz" | sha256sum --check
                  tar -xzf "$scratch/jj.tar.gz" -C "$scratch" ./jj
                  sudo install "$scratch/jj" /usr/local/bin/jj
                  jj --version

            - name: Test JJ push gate
              run: python3 -m unittest discover -s tests -p 'test_jj_push.py' -v

            - name: Specification path regression tests
              run: bash tests/spec-presence

            # Third-party actions must be pinned to a full commit SHA;
            # first-party paths (./) and runedeck/* refs are exempt.
            - name: Action pinning
              run: |
                  # Comments are stripped before the SHA test so trailing
                  # text cannot fake a pin.
                  violations=$(grep -RnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*["'\'']?[^./[:space:]"'\'']' .github/workflows templates/*/.github/workflows 2>/dev/null \
                      | sed 's/[[:space:]]#.*$//' \
                      | grep -vE 'uses:[[:space:]]*["'\'']?(\./|runedeck/)' \
                      | grep -vE '@[0-9a-f]{40}["'\'']?$' || true)
                  if [ -n "$violations" ]; then
                      echo "Unpinned third-party actions:"
                      printf '%s\n' "$violations"
                      exit 1
                  fi
                  echo "All third-party actions pinned."

            # The pull request under check: on merge_group its number is in
            # the queue branch name, on push it is the open pull request whose
            # head is this branch. A push with no pull request yet (the first
            # push, before Draft Open) and a push to the default branch have
            # no body to attest.
            - name: Release notes attestation
              if: github.event_name == 'merge_group' || github.ref_name != github.event.repository.default_branch
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  OWNER: ${{ github.repository_owner }}
                  BRANCH: ${{ github.ref_name }}
                  QUEUE_REF: ${{ github.event.merge_group.head_ref }}
              run: |
                  set -o pipefail
                  if [ -n "$QUEUE_REF" ]; then
                      number=$(printf '%s\n' "$QUEUE_REF" | sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-.*$#\1#p')
                      [ -n "$number" ] || { echo "cannot read the pull request number from $QUEUE_REF"; exit 1; }
                  else
                      number=$(gh api --paginate "repos/$REPOSITORY/pulls?state=open&head=$OWNER:$BRANCH&per_page=100" \
                          --jq '[.[].number]' | jq -s -r 'add // [] | first // ""') \
                          || { echo "could not read the pull requests for $BRANCH (API or permission failure)"; exit 1; }
                      if [ -z "$number" ]; then
                          echo "no open pull request for $BRANCH yet; nothing to attest."
                          exit 0
                      fi
                  fi
                  # The fetch and the parse fail separately: an API or
                  # permission fault must not read as a missing section.
                  body=$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.body // ""') \
                      || { echo "could not read the pull request body (API or permission failure)"; exit 1; }
                  if printf '%s\n' "$body" \
                      | awk '/^## Release Notes[[:space:]]*$/{in_section=1; next} /^## /{in_section=0} in_section && /^([-*+]|[0-9]+[.)]) /{found=1} END{exit !found}'; then
                      echo "Release Notes section present."
                  else
                      echo "The pull request body needs a '## Release Notes' section with at least one entry ('- N/A' for non-user-facing work)."
                      exit 1
                  fi

            - name: Install tools
              run: bash scripts/install-tools

            - name: Test the draft body against the pull request schema
              run: bash tests/draft-open-body

            - name: Test the generated Vale style
              run: python3 -m unittest discover -s tests -p 'test_vale_style.py' -v

            # The prek CLI is called directly: the wrapper action logs at
            # TRACE level and buries the failing hook's output. REQUIRE_GATES
            # turns a missing linter into a failure instead of a skip.
            - name: Commit-stage checks
              env:
                  REQUIRE_GATES: "1"
              run: prek run --all-files

            # A template change must prove the Copier update path before the
            # nightly canary finds it broken (skeleton#45). A merge group runs
            # it when templates/, copier.yaml, or tests/ changed since its
            # base; a push, when they changed since the previous tip. A push
            # with no usable previous tip (a new branch, main) always runs it.
            - name: Exercise Copier updates
              env:
                  RUFF_NO_CACHE: "true"
                  REQUIRE_GATES: "1"
                  BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
                  HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
              run: |
                  if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
                      relevant=false
                      while IFS= read -r changed; do
                          case "$changed" in
                              templates/*|copier.yaml|tests/*) relevant=true ;;
                          esac
                      done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
                      if [ "$relevant" = false ]; then
                          echo "no template, copier, or test change; the Copier canary stays nightly."
                          exit 0
                      fi
                  fi
                  bash tests/copier-update-canary

            # Scan exactly the commits this event introduces. Without a usable
            # base, gitleaks scans the target history and other hooks inspect all files.
            - name: Pre-push-stage checks
              env:
                  MERGE_BASE: ${{ github.event.merge_group.base_sha }}
                  MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
                  PUSH_BEFORE: ${{ github.event.before }}
                  PUSH_SHA: ${{ github.sha }}
              run: |
                  # A merge group scans from its base to the merge it is
                  # about to make; a push scans from its previous tip.
                  if [ -n "$MERGE_BASE" ]; then
                      from="$MERGE_BASE"
                      to="$MERGE_HEAD"
                  elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -q '^0*$'; then
                      from="$PUSH_BEFORE"
                      to="$PUSH_SHA"
                  else
                      from=""
                      to="$PUSH_SHA"
                  fi
                  if [ -n "$from" ] && git cat-file -e "$from" 2>/dev/null; then
                      prek run --stage pre-push --from-ref "$from" --to-ref "$to"
                  else
                      GITLEAKS_PUSH_TO_REF="$to" prek run --stage pre-push --all-files
                  fi
