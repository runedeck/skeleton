name: Machinery Canary

on:
    schedule:
        - cron: "15 4 * * *"
    workflow_dispatch: {}

permissions:
    contents: read
    issues: write

env:
    GITLEAKS_VERSION: "8.30.1"

jobs:
    canary:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            # Exercise the ceremony machinery against main on a schedule, so
            # fix-the-fixer breakage surfaces here instead of contaminating
            # feature pull requests.
            - name: Run the machinery
              id: run
              continue-on-error: true
              run: |
                  set -x
                  sudo apt-get install -y shellcheck
                  pipx install prek ruff semgrep
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
                  sudo install gitleaks /usr/local/bin/gitleaks
                  shellcheck -S warning templates/base/.githooks/*
                  prek run --all-files
                  bash templates/base/.githooks/pre-push </dev/null || true

            - name: Report breakage
              if: steps.run.outcome == 'failure'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  existing=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=machinery-canary" --jq '.[0].number // empty')
                  body="The nightly machinery canary failed on main: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  if [ -n "$existing" ]; then
                      gh api -X POST "repos/${{ github.repository }}/issues/$existing/comments" -f body="$body" >/dev/null
                  else
                      gh api -X POST "repos/${{ github.repository }}/issues" \
                          -f title="Machinery canary failing" -f body="$body" -f "labels[]=machinery-canary" >/dev/null
                  fi
