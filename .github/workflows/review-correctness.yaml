name: Review Correctness

on:
    pull_request:
        types: [ready_for_review, reopened, synchronize, labeled]

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write
    actions: read

# Queued, never cancelled: a seal pushed while the parent's review is in
# flight must not kill that review — the seal run that follows will skip
# itself, and the finished verdict is what lets the seal restore approval.
concurrency:
    group: review-correctness-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    correctness:
        name: review/correctness
        # Summoned, never ambient: the lane runs only while the owner's
        # summon label is on the pull request, only for the owner's
        # non-draft pull requests. Bugbot runs unsummoned (it is free);
        # Macroscope answers its own summon label via the dashboard's
        # always-review configuration.
        if: >
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login == 'N4M3Z' &&
            contains(github.event.pull_request.labels.*.name, 'summon:runeseer') &&
            (github.event.action != 'labeled' || github.event.label.name == 'summon:runeseer')
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
              with:
                  fetch-depth: 0

            # Only a genuine ritual seal skips the review: empty,
            # signature-verified, authored by the submitter or the owner,
            # seal: subject — the same test the seal check makes.
            - id: seal-head
              name: Skip seal heads
              env:
                  GH_TOKEN: ${{ github.token }}
                  SUBMITTER: ${{ github.event.pull_request.user.login }}
              run: |
                  commit=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}")
                  subject=$(printf '%s' "$commit" | jq -r '.commit.message' | head -1)
                  verified=$(printf '%s' "$commit" | jq -r '.commit.verification.verified')
                  author=$(printf '%s' "$commit" | jq -r '.author.login // empty')
                  files=$(printf '%s' "$commit" | jq -r '(.files // []) | length')
                  if printf '%s' "$subject" | grep -q '^seal:' \
                      && [ "$verified" = "true" ] \
                      && { [ "$author" = "$SUBMITTER" ] || [ "$author" = "N4M3Z" ]; } \
                      && [ "$files" = "0" ]; then
                      echo "seal=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "seal=false" >> "$GITHUB_OUTPUT"
                  fi

            # Prose-only diffs are the conventions lane's territory; the
            # subscription reviews executable surface. Markdown under
            # docs/specs or .github stays in scope, since canon and
            # machinery are executable in the way that matters.
            - id: scope
              name: Scope to reviewable changes
              if: steps.seal-head.outputs.seal == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  files=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --name-only)
                  substantive=$(printf '%s\n' "$files" | grep -Ev '\.md$' || true)
                  in_scope_md=$(printf '%s\n' "$files" | grep -E '^(docs/specs/|\.github/).*\.md$' || true)
                  if [ -z "$substantive" ] && [ -z "$in_scope_md" ]; then
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      echo "Prose-only change; correctness lane stands down."
                  else
                      echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi

            # The subscription lane goes last: wait for the free lanes'
            # verdicts on this head so the adjudicator reviews a stabilized
            # tree once. Presence-aware: each expected app must have created
            # AND concluded its runs; capped well under the job timeout.
            - name: Wait for the other lanes
              if: steps.seal-head.outputs.seal == 'false' && steps.scope.outputs.skip == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  MACROSCOPE_SUMMONED: ${{ contains(github.event.pull_request.labels.*.name, 'summon:macroscope') }}
              run: |
                  # Bugbot runs unsummoned; Macroscope only answers its
                  # summon label, so expect it only when summoned.
                  expected="cursor"
                  [ "$MACROSCOPE_SUMMONED" = "true" ] && expected="cursor macroscopeapp"
                  for _ in $(seq 1 45); do
                      settled=true
                      for app in $expected; do
                          runs=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
                              --jq "[.check_runs[] | select(.app.slug == \"$app\")]")
                          total=$(printf '%s' "$runs" | jq 'length')
                          done_count=$(printf '%s' "$runs" | jq '[.[] | select(.status == "completed")] | length')
                          if [ "$total" = "0" ] || [ "$done_count" != "$total" ]; then
                              settled=false
                          fi
                      done
                      [ "$settled" = "true" ] && { echo "other lanes settled"; exit 0; }
                      sleep 20
                  done
                  echo "other lanes absent or still running after 15m; reviewing anyway"

            # Cross-round ledger: the previous round's verdict artifact, when
            # one exists, tells the adjudicator what was already reported and
            # which sha was last judged, enabling delta re-reviews.
            - id: ledger
              name: Fetch the previous verdict
              if: steps.seal-head.outputs.seal == 'false' && steps.scope.outputs.skip == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  name="runeseer-verdict-pr${{ github.event.pull_request.number }}"
                  # --slurp collects the pages into one array before the jq
                  # filter runs; without it the filter runs per page and a
                  # multi-page history yields several ids.
                  artifact=$(gh api --paginate --slurp "repos/${{ github.repository }}/actions/artifacts?name=$name&per_page=100" \
                      --jq '[.[].artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
                  prev_sha=""
                  if [ -n "$artifact" ]; then
                      gh api "repos/${{ github.repository }}/actions/artifacts/$artifact/zip" > prev-verdict.zip \
                          && unzip -o prev-verdict.zip runeseer-verdict.json -d .previous-verdict >/dev/null \
                          && prev_sha=$(jq -r '.sha // empty' .previous-verdict/runeseer-verdict.json) || true
                  fi
                  echo "prev_sha=${prev_sha}" >> "$GITHUB_OUTPUT"
                  echo "previous verdict: ${prev_sha:-none}"

            # The other lanes' findings land on disk before the model starts,
            # so the model needs no raw API access: an injected instruction in
            # a PR comment can at worst skew the review it was already part of,
            # never call the API with the write-scoped token.
            - id: lanes
              name: Fetch the other lanes' findings
              if: steps.seal-head.outputs.seal == 'false' && steps.scope.outputs.skip == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p .lane
                  gh api --paginate --slurp "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments?per_page=100" \
                      --jq 'add // []' > .lane/inline-comments.json
                  gh api --paginate --slurp "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
                      --jq 'add // []' > .lane/issue-comments.json
                  echo "inline: $(jq 'length' .lane/inline-comments.json), issue: $(jq 'length' .lane/issue-comments.json)"

            - id: runeseer
              if: steps.seal-head.outputs.seal == 'false' && steps.scope.outputs.skip == 'false'
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.RUNESEER_APP_ID }}
                  private-key: ${{ secrets.RUNESEER_APP_KEY }}

            - if: steps.seal-head.outputs.seal == 'false' && steps.scope.outputs.skip == 'false'
              uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ steps.runeseer.outputs.token }}
                  allowed_bots: "runewright"
                  track_progress: true
                  claude_args: |
                      --allowedTools "Read,Write,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*)"
                  prompt: >
                      You are the adjudicating reviewer; the other lanes have
                      already spoken. Their output is on disk:
                      .lane/inline-comments.json holds the inline review
                      comments and .lane/issue-comments.json the issue
                      comments; the findings are those from
                      macroscopeapp[bot] and cursor[bot]. Judge each finding
                      against the code:
                      confirmed, disputed (say why), or already addressed.
                      A previous-round ledger may exist at
                      .previous-verdict/runeseer-verdict.json; findings
                      listed there are already reported, so never re-report
                      them, and when its sha
                      (${{ steps.ledger.outputs.prev_sha }}) is an ancestor
                      of HEAD, focus your own review on the range from that
                      sha to HEAD rather than the whole diff. Review for
                      correctness defects only: logic errors, broken
                      invariants, silent failure modes, security problems,
                      claims the diff does not uphold. Post inline comments
                      only for findings of medium severity and above;
                      collect low-severity nits into a Digest section of
                      your summary instead. Never duplicate another lane.
                      Then write runeseer-verdict.json in the workspace
                      root: {"sha": full HEAD sha, "verdict": "clean" or
                      "findings", "count": N, "findings": [{"path", "line",
                      "summary", "lane", "judgment"}]} covering every
                      unresolved genuine finding from any lane. Finally post
                      exactly one summary comment via gh pr comment: first
                      line exactly `review/correctness: clean @SHA` or
                      `review/correctness: N findings @SHA` (full HEAD sha),
                      then your per-finding judgments of the other lanes,
                      then the Digest. A review that posts nothing is a
                      failed review.

            # The verdict artifact is the machine-readable record: the next
            # round's ledger, and the approval's evidence.
            - name: Upload verdict
              if: steps.seal-head.outputs.seal == 'false' && steps.scope.outputs.skip == 'false'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
              with:
                  name: runeseer-verdict-pr${{ github.event.pull_request.number }}
                  path: runeseer-verdict.json
                  retention-days: 30
                  if-no-files-found: warn

            # Earned approval: a clean verdict FOR THIS HEAD, read from the
            # artifact rather than comment archaeology.
            - name: Approve on clean verdict
              if: steps.seal-head.outputs.seal == 'false' && steps.scope.outputs.skip == 'false'
              env:
                  GH_TOKEN: ${{ steps.runeseer.outputs.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  [ -f runeseer-verdict.json ] || { echo "no verdict file; not approving"; exit 0; }
                  verdict=$(jq -r '.verdict // empty' runeseer-verdict.json)
                  sha=$(jq -r '.sha // empty' runeseer-verdict.json)
                  echo "verdict=$verdict sha=$sha head=$HEAD_SHA"
                  if [ "$verdict" = "clean" ] && [ "$sha" = "$HEAD_SHA" ]; then
                      gh api -X POST "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
                          -f event=APPROVE \
                          -f body="Earned approval: review/correctness returned a clean verdict for ${HEAD_SHA}. Dismissed automatically on any new push."
                  fi

            # Metrics: cost, turns, and finding counts land in the job
            # summary so the round-trip's worth stays measured, not vibed.
            - name: Metrics
              if: always() && steps.seal-head.outputs.seal == 'false' && steps.scope.outputs.skip == 'false'
              run: |
                  exec_log=/home/runner/work/_temp/claude-execution-output.json
                  cost="?"; turns="?"
                  if [ -f "$exec_log" ]; then
                      cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // "?"' "$exec_log" 2>/dev/null || echo "?")
                      turns=$(jq -r '[.[] | select(.type == "result")] | last | .num_turns // "?"' "$exec_log" 2>/dev/null || echo "?")
                  fi
                  count="?"
                  [ -f runeseer-verdict.json ] && count=$(jq -r '.count // "?"' runeseer-verdict.json)
                  {
                      echo "### review/correctness metrics"
                      echo "- unresolved findings: $count"
                      echo "- turns: $turns, est. cost: \$$cost"
                      echo "- previous verdict sha: ${{ steps.ledger.outputs.prev_sha || 'none' }}"
                  } >> "$GITHUB_STEP_SUMMARY"
