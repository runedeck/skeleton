name: Review Correctness

on:
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write

concurrency:
    group: review-correctness-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    correctness:
        name: review/correctness
        # The subscription token spends only on the owner's pull requests, and
        # drafts stay free for iteration. A seal head is an empty owner
        # commit; re-reviewing it would re-spend for an unchanged tree, and
        # the owner-seal workflow restores the approval instead.
        if: >
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login == 'N4M3Z'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
              with:
                  fetch-depth: 0

            - id: seal-head
              name: Skip seal heads
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  subject=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" --jq '.commit.message' | head -1)
                  if printf '%s' "$subject" | grep -q '^seal:'; then
                      echo "seal=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "seal=false" >> "$GITHUB_OUTPUT"
                  fi

            # The subscription lane goes last: wait for the free lanes'
            # verdicts on this head so Claude reviews a stabilized tree once
            # and skips what they already found. New pushes cancel the wait
            # via the concurrency group.
            - name: Wait for the other lanes
              if: steps.seal-head.outputs.seal == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  # Presence-aware: each expected app must have created its
                  # check run for this head AND concluded it. Counting only
                  # visibly-pending runs would race the apps' webhook lag
                  # and read "not started yet" as "finished".
                  expected="macroscopeapp cursor"
                  for _ in $(seq 1 60); do
                      settled=true
                      for app in $expected; do
                          runs=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
                              --jq "[.check_runs[] | select(.app.slug == \"$app\")]")
                          total=$(printf '%s' "$runs" | jq 'length')
                          done_count=$(printf '%s' "$runs" | jq '[.[] | select(.status == "completed")] | length')
                          if [ "$total" = "0" ] || [ "$done_count" != "$total" ]; then
                              settled=false
                          fi
                      done
                      [ "$settled" = "true" ] && { echo "other lanes settled"; exit 0; }
                      sleep 20
                  done
                  echo "other lanes absent or still running after 20m; reviewing anyway"

            - id: runeseer
              if: steps.seal-head.outputs.seal == 'false'
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.RUNESEER_APP_ID }}
                  private-key: ${{ secrets.RUNESEER_APP_KEY }}

            - if: steps.seal-head.outputs.seal == 'false'
              uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ steps.runeseer.outputs.token }}
                  allowed_bots: "runewright"
                  track_progress: true
                  claude_args: |
                      --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
                  prompt: >
                      You are the adjudicating reviewer; the other lanes have
                      already spoken. First fetch their output: the inline
                      review comments (gh api
                      repos/OWNER/REPO/pulls/N/comments) and issue comments
                      from macroscopeapp[bot] and cursor[bot]. Judge each of
                      their findings against the actual code: confirmed,
                      disputed (say why), or already addressed by a later
                      commit. Then review the full diff yourself for
                      correctness defects they missed: logic errors, broken
                      invariants, silent failure modes, security problems,
                      claims the diff does not uphold. Post only NET-NEW
                      findings as inline comments; never duplicate another
                      lane. Skip style and conventions. You MUST end with
                      exactly one summary comment via gh pr comment: after
                      the first line, list your per-finding judgments of the
                      other lanes. The first line MUST be exactly
                      `review/correctness: clean` when no unresolved genuine
                      finding remains from any lane, or
                      `review/correctness: N findings` counting all
                      unresolved genuine findings, yours and theirs. A
                      review that posts nothing is a failed review.

            # Earned approval: a clean verdict on the owner's pull request
            # becomes runeseer's approving review. The ruleset dismisses it
            # on any later push, so approval always reflects the reviewed
            # head.
            - name: Approve on clean verdict
              if: steps.seal-head.outputs.seal == 'false'
              env:
                  GH_TOKEN: ${{ steps.runeseer.outputs.token }}
              run: |
                  verdict=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                      --jq '[.[] | select(.user.login == "runeseer[bot]") | .body] | last' \
                      | grep -oE '^review/correctness: (clean|[0-9]+ findings)' | head -1 || true)
                  echo "verdict: ${verdict:-none found}"
                  if [ "$verdict" = "review/correctness: clean" ]; then
                      gh api -X POST "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
                          -f event=APPROVE \
                          -f body="Earned approval: review/correctness returned a clean verdict on $(git rev-parse --short HEAD). Dismissed automatically on any new push."
                  fi
