name: Review Correctness

on:
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write

concurrency:
    group: review-correctness-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    correctness:
        name: review/correctness
        # The subscription token spends only on the owner's pull requests, and
        # drafts stay free for iteration.
        if: >
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login == 'N4M3Z'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
              with:
                  fetch-depth: 0

            - id: runeseer
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.RUNESEER_APP_ID }}
                  private-key: ${{ secrets.RUNESEER_APP_KEY }}

            - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ steps.runeseer.outputs.token }}
                  allowed_bots: "runewright"
                  track_progress: true
                  claude_args: |
                      --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
                  prompt: >
                      Review this pull request for correctness defects only:
                      logic errors, broken invariants, silent failure modes,
                      security problems, and claims the diff does not uphold.
                      Read the full diff and enough surrounding context to
                      judge it. Post genuine findings as inline review
                      comments on the pull request; do not comment on style,
                      naming, or conventions, which other lanes own. You MUST
                      end by posting exactly one summary comment with
                      `gh pr comment`: either a one-line tally of the
                      findings you posted, or, when nothing qualified, one
                      short line saying the review found no correctness
                      defects. A review that posts nothing is a failed
                      review.
