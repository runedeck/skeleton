name: Review Correctness

# Thin caller: the lane's body lives in runedeck/seer. The caller owns
# the triggers, the concurrency, and the permissions; only review-label
# events and new pushes may cancel an active run, so an unrelated label
# never kills a billed review mid-flight. Round-end label consumption in
# the lane rides the workflow token, whose removals emit no events, so a
# clean round never re-enters here; only a manual unlabel does, and the
# lane then skips while the mirror reads the head's recorded verdict
# from the artifact rather than from this run's result.
on:
    pull_request:
        types: [opened, ready_for_review, reopened, synchronize, labeled, unlabeled]

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write
    actions: read
    checks: read

concurrency:
    group: review-correctness-${{ github.event.pull_request.number }}
    cancel-in-progress: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'review' || github.event.label.name == 'review:runeseer' }}

jobs:
    review:
        if: github.event.pull_request.draft == false
        uses: runedeck/seer/.github/workflows/review-correctness.yaml@main
        secrets:
            RUNESEER_APP_ID: ${{ secrets.RUNESEER_APP_ID }}
            RUNESEER_APP_KEY: ${{ secrets.RUNESEER_APP_KEY }}
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    # Mirrors the called lane's result under the stable check context the
    # rulesets require. Fail-closed and event-independent: when the lane did
    # not run in this workflow, the newest verdict artifact decides, so an
    # unrelated label event can never redden an adjudicated head and a
    # skipped run can never green an unjudged one. The lane's prose-only
    # stand-down concludes success in-job, so it reports green here. Drafts
    # skip the mirror: a draft cannot merge, and its iteration stays quiet.
    review-context:
        name: review/correctness
        needs: review
        if: always() && github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  [ "${{ needs.review.result }}" = "success" ] && exit 0
                  if [ "${{ needs.review.result }}" = "failure" ]; then
                      echo "the lane concluded: failure"
                      exit 1
                  fi
                  # Lane skipped or cancelled in this run: the recorded verdict
                  # artifacts decide, validated with the same strict tuple the
                  # approval gate uses. Candidates are walked newest first and
                  # each is checked for provenance, because any pull-request
                  # workflow can upload an artifact under any name; a foreign
                  # artifact skips only itself and never hides an authentic
                  # verdict beneath it. Verdict artifacts carry a 30-day
                  # retention; a head that sits unmerged past it reports red
                  # until a fresh round runs, which is the intended staleness
                  # rather than a defect: a month-old adjudication has not
                  # judged the base branch the pull request would merge into
                  # today.
                  name="runeseer-verdict-pr${{ github.event.pull_request.number }}"
                  candidates=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=$name&per_page=100" \
                      --jq '[.artifacts[] | select(.expired == false)]' \
                      | jq -s -r 'add // [] | sort_by(.created_at) | reverse
                          | .[] | "\(.id) \(.workflow_run.id // "")"')
                  while read -r artifact run_id; do
                      [ -n "${artifact:-}" ] && [ -n "${run_id:-}" ] || continue
                      # A lookup that fails and a run that belongs to another
                      # workflow are different answers: the first leaves this
                      # candidate unjudged and ends the walk, the second is a
                      # foreign artifact that skips only itself.
                      if ! run_path=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.path' 2>/dev/null); then
                          echo "run $run_id is unreadable; the verdict behind artifact $artifact cannot be confirmed"
                          break
                      fi
                      if [ "$run_path" != ".github/workflows/review-correctness.yaml" ]; then
                          echo "verdict artifact $artifact came from $run_path; skipping it"
                          continue
                      fi
                      rm -rf .verdict
                      # An authentic artifact that cannot be read ends the walk:
                      # continuing would let an older clean verdict for this
                      # head stand in for a newer one nobody has seen.
                      if ! gh api "repos/${{ github.repository }}/actions/artifacts/$artifact/zip" > verdict.zip \
                          || ! unzip -o verdict.zip runeseer-verdict.json -d .verdict >/dev/null; then
                          echo "verdict artifact $artifact is unreadable; the recorded verdict cannot be confirmed"
                          break
                      fi
                      # Parseability is judged before content, so a malformed
                      # verdict reads as unconfirmable rather than as merely
                      # not clean, which would fall through to an older one.
                      if ! jq -e . .verdict/runeseer-verdict.json >/dev/null 2>&1; then
                          echo "verdict artifact $artifact is malformed; the recorded verdict cannot be confirmed"
                          break
                      fi
                      if jq -e --arg sha "$HEAD_SHA" '
                          .verdict == "clean" and .count == 0
                          and (.findings | type == "array" and length == 0)
                          and .sha == $sha' .verdict/runeseer-verdict.json >/dev/null 2>&1; then
                          echo "clean verdict on record for $HEAD_SHA"
                          exit 0
                      fi
                      # An authentic verdict for this head settles the question:
                      # an older artifact cannot overturn what this one records.
                      if jq -e --arg sha "$HEAD_SHA" '.sha == $sha' .verdict/runeseer-verdict.json >/dev/null 2>&1; then
                          echo "the recorded verdict for $HEAD_SHA holds findings"
                          break
                      fi
                  done <<<"$candidates"
                  echo "no clean verdict for this head; the funnel summons it, or re-apply the review label"
                  exit 1
