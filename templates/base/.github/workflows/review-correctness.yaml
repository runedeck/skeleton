name: Review Correctness

# Thin caller: the lane's body lives in runedeck/seer. The caller owns
# the triggers, the concurrency, and the permissions; only review-label
# events and new pushes may cancel an active run, so an unrelated label
# never kills a billed review mid-flight. Round-end label consumption in
# the lane rides the workflow token, whose removals emit no events, so a
# clean round never re-enters here; only a manual unlabel does, and the
# lane then skips while the fail-closed mirror holds the head red until
# re-summoned.
on:
    pull_request:
        types: [opened, ready_for_review, reopened, synchronize, labeled, unlabeled]

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write
    actions: read
    checks: read

concurrency:
    group: review-correctness-${{ github.event.pull_request.number }}
    cancel-in-progress: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'review' || github.event.label.name == 'review:runeseer' }}

jobs:
    review:
        uses: runedeck/seer/.github/workflows/review-correctness.yaml@main
        secrets:
            RUNESEER_APP_ID: ${{ secrets.RUNESEER_APP_ID }}
            RUNESEER_APP_KEY: ${{ secrets.RUNESEER_APP_KEY }}
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    # Mirrors the called lane's result under the stable check context the
    # rulesets require. Fail-closed and event-independent: when the lane did
    # not run in this workflow, the newest verdict artifact decides, so an
    # unrelated label event can never redden an adjudicated head and a
    # skipped run can never green an unjudged one. The lane's prose-only
    # stand-down concludes success in-job, so it reports green here. Drafts
    # skip the mirror: a draft cannot merge, and its iteration stays quiet.
    review-context:
        name: review/correctness
        needs: review
        if: always() && github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  [ "${{ needs.review.result }}" = "success" ] && exit 0
                  if [ "${{ needs.review.result }}" = "failure" ]; then
                      echo "the lane concluded: failure"
                      exit 1
                  fi
                  # Lane skipped or cancelled in this run: the newest verdict
                  # artifact for this pull request decides, validated with the
                  # same strict tuple the approval gate uses. The artifact name
                  # matches the lane's ARTIFACT_PREFIX plus the number.
                  name="runeseer-verdict-pr${{ github.event.pull_request.number }}"
                  artifact=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=$name&per_page=100" \
                      --jq '[.artifacts[] | select(.expired == false)]' \
                      | jq -s -r 'add // [] | sort_by(.created_at) | last | .id // empty')
                  if [ -n "$artifact" ]; then
                      gh api "repos/${{ github.repository }}/actions/artifacts/$artifact/zip" > verdict.zip \
                          && unzip -o verdict.zip runeseer-verdict.json -d .verdict >/dev/null || true
                      if jq -e --arg sha "$HEAD_SHA" '
                          .verdict == "clean" and .count == 0
                          and (.findings | type == "array" and length == 0)
                          and .sha == $sha' .verdict/runeseer-verdict.json >/dev/null 2>&1; then
                          echo "clean verdict on record for $HEAD_SHA"
                          exit 0
                      fi
                  fi
                  echo "no clean verdict for this head; the funnel summons it, or re-apply the review label"
                  exit 1
