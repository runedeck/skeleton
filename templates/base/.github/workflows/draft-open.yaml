name: Draft Open

# The app opens a draft pull request on the first push of a ceremony branch
# (docs/specs/review-ceremony, Draft by the App, Ready by the Owner). The
# draft carries the session's ceremony body from docs/changes/<id>/
# pull-request.md when the branch has one, else a placeholder body that
# passes schemas/PULL_REQUEST.mdschema. A branch that ever had a pull
# request gets no second draft. Nothing here flips a draft to ready: that
# is the owner's `rune sign open`. The runewright token is minted for the
# create call alone, so the pull request opens under the app identity.
on:
    push:
        branches:
            - "change/**"
            - "codex/**"
            - "fable/**"

permissions: {}

# Two pushes to one branch in quick succession must not race to two
# drafts; the group serializes them and the second finds the first's draft.
concurrency:
    group: draft-open-${{ github.ref }}
    cancel-in-progress: false

jobs:
    open:
        if: github.ref_name != github.event.repository.default_branch && !github.event.deleted
        runs-on: ubuntu-latest
        timeout-minutes: 3
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Find an existing pull request
              id: existing
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  OWNER: ${{ github.repository_owner }}
                  BRANCH: ${{ github.ref_name }}
              run: |
                  set -o pipefail
                  # state=all: a closed or merged pull request also spends
                  # the branch's first push. Pages merge through jq -s.
                  count=$(gh api --paginate "repos/$REPOSITORY/pulls?state=all&head=$OWNER:$BRANCH&per_page=100" \
                      --jq '[.[].number]' | jq -s 'add // [] | length') \
                      || { echo "could not read the pull requests for $BRANCH; rerun the workflow"; exit 1; }
                  if [ "$count" != "0" ]; then
                      echo "found=true" >> "$GITHUB_OUTPUT"
                      echo "$BRANCH already has a pull request; no second draft opens."
                  else
                      echo "found=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              if: steps.existing.outputs.found == 'false'
              with:
                  persist-credentials: false

            - name: Compose the body
              if: steps.existing.outputs.found == 'false'
              id: body
              env:
                  BRANCH: ${{ github.ref_name }}
                  HEAD_MESSAGE: ${{ github.event.head_commit.message }}
              run: |
                  set -euo pipefail
                  change_id=${BRANCH#*/}
                  title=$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)
                  [ -n "$title" ] || title="Draft: $BRANCH"
                  body="$RUNNER_TEMP/pull-request.md"
                  if [ -f "docs/changes/$change_id/pull-request.md" ]; then
                      cp "docs/changes/$change_id/pull-request.md" "$body"
                      echo "body from docs/changes/$change_id/pull-request.md"
                  else
                      cat > "$body" <<EOF
                  Draft for \`$BRANCH\`: the session agent fills this body before \`rune sign open\`.

                  ## Plan

                  Why this shape, one or two sentences.

                  ## Changes

                  - Fill in: verb-first, file-anchored claims the diff upholds.

                  ## Testing

                  - [ ] Fill in: the command run and its outcome.

                  ## Release Notes

                  - N/A
                  EOF
                      echo "body from the placeholder template"
                  fi
                  printf 'title=%s\n' "$title" >> "$GITHUB_OUTPUT"
                  printf 'body=%s\n' "$body" >> "$GITHUB_OUTPUT"

            - id: runewright
              if: steps.existing.outputs.found == 'false'
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.RUNEWRIGHT_APP_ID }}
                  private-key: ${{ secrets.RUNEWRIGHT_APP_KEY }}
                  permission-contents: read
                  permission-pull-requests: write

            - name: Open the draft
              if: steps.existing.outputs.found == 'false'
              env:
                  GH_TOKEN: ${{ steps.runewright.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  BRANCH: ${{ github.ref_name }}
                  TITLE: ${{ steps.body.outputs.title }}
                  BODY: ${{ steps.body.outputs.body }}
              run: |
                  set -euo pipefail
                  gh pr create --repo "$REPOSITORY" --draft \
                      --base "$DEFAULT_BRANCH" --head "$BRANCH" \
                      --title "$TITLE" --body-file "$BODY"
