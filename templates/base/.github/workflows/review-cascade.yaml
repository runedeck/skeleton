name: Review Cascade

# Thin caller: the funnel walk lives in runedeck/seer. pull_request_target,
# deliberately: the walk is API-only and checks out nothing, and fork pull
# requests need the base-context secrets. Never add a head checkout here
# or in the body.
on:
    pull_request_target:
        types: [opened, ready_for_review, reopened, labeled]

# The body's reads (check runs, the live head, review threads) ride the
# workflow token; issues: write lets it also consume labels on that
# token, whose events trigger nothing and so can never cancel a lane.
permissions:
    contents: read
    checks: read
    pull-requests: read
    issues: write

# Only a fresh bare review label may cancel a walk: the walk's own
# stage labels re-enter this group and must never kill it.
concurrency:
    group: review-cascade-${{ github.event.pull_request.number }}-${{ github.event.action == 'reopened' && 'reopen' || 'walk' }}
    cancel-in-progress: ${{ github.event.label.name == 'review' }}

jobs:
    reopen:
        if: github.event.action == 'reopened' && github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - id: runewright
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.RUNEWRIGHT_APP_ID }}
                  private-key: ${{ secrets.RUNEWRIGHT_APP_KEY }}

            - name: Restart the review walk
              env:
                  CALLER_TOKEN: ${{ github.token }}
                  GH_TOKEN: ${{ steps.runewright.outputs.token }}
              run: |
                  active_labels=$(GH_TOKEN=$CALLER_TOKEN gh api \
                      "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
                      --jq '.[].name')
                  if printf '%s\n' "$active_labels" | grep -qx review; then
                      GH_TOKEN=$CALLER_TOKEN gh api -X DELETE \
                          "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/review" \
                          >/dev/null
                  fi
                  gh api -X POST \
                      "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
                      -f "labels[]=review" >/dev/null

    cascade:
        if: github.event.pull_request.draft == false
        uses: runedeck/seer/.github/workflows/review-cascade.yaml@main
        secrets:
            RUNEWRIGHT_APP_ID: ${{ secrets.RUNEWRIGHT_APP_ID }}
            RUNEWRIGHT_APP_KEY: ${{ secrets.RUNEWRIGHT_APP_KEY }}
