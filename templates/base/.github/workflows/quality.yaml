name: Quality

# Two runs, two facts. The push run proves the head commit: it is the
# green-head signal Draft Open and the review controller re-enter on, and
# its log is the receipt `rune sign submit` carries. The merge_group run
# proves the merge the queue is about to make, and the ruleset requires it.
# There is no pull_request run: GitHub builds that merge commit once and
# never rebuilds it when the base moves, so its verdict is about a tree
# nobody can inspect (runedeck/cli #67, 2026-09-21). The queue's temporary
# branches are proven by the merge_group run alone.
on:
    push:
        branches-ignore:
            - "gh-readonly-queue/**"
    merge_group:
        types: [checks_requested]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  # The prek hooks execute code from the checked-out tree, which
                  # must never find a usable token in the git config.
                  persist-credentials: false

            # Third-party actions must be pinned to a full commit SHA;
            # first-party paths (./) and runedeck/* refs are exempt.
            - name: Action pinning
              run: |
                  # Comments are stripped before the SHA test so trailing
                  # text cannot fake a pin.
                  violations=$(grep -RnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*["'\'']?[^./[:space:]"'\'']' .github/workflows 2>/dev/null \
                      | sed 's/[[:space:]]#.*$//' \
                      | grep -vE 'uses:[[:space:]]*["'\'']?(\./|runedeck/)' \
                      | grep -vE '@[0-9a-f]{40}["'\'']?$' || true)
                  if [ -n "$violations" ]; then
                      echo "Unpinned third-party actions:"
                      printf '%s\n' "$violations"
                      exit 1
                  fi
                  echo "All third-party actions pinned."

            # The pull request under check: on merge_group its number is in
            # the queue branch name, on push it is the open pull request whose
            # head is this branch. A push with no pull request yet (the first
            # push, before Draft Open) and a push to the default branch have
            # no body to attest.
            - name: Release notes attestation
              if: github.event_name == 'merge_group' || github.ref_name != github.event.repository.default_branch
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  OWNER: ${{ github.repository_owner }}
                  BRANCH: ${{ github.ref_name }}
                  QUEUE_REF: ${{ github.event.merge_group.head_ref }}
              run: |
                  set -o pipefail
                  if [ -n "$QUEUE_REF" ]; then
                      number=$(printf '%s\n' "$QUEUE_REF" | sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-.*$#\1#p')
                      [ -n "$number" ] || { echo "cannot read the pull request number from $QUEUE_REF"; exit 1; }
                  else
                      number=$(gh api --paginate "repos/$REPOSITORY/pulls?state=open&head=$OWNER:$BRANCH&per_page=100" \
                          --jq '[.[].number]' | jq -s -r 'add // [] | first // ""') \
                          || { echo "could not read the pull requests for $BRANCH (API or permission failure)"; exit 1; }
                      if [ -z "$number" ]; then
                          echo "no open pull request for $BRANCH yet; nothing to attest."
                          exit 0
                      fi
                  fi
                  # The fetch and the parse fail separately: an API or
                  # permission fault must not read as a missing section.
                  body=$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.body // ""') \
                      || { echo "could not read the pull request body (API or permission failure)"; exit 1; }
                  if printf '%s\n' "$body" \
                      | awk '/^## Release Notes[[:space:]]*$/{in_section=1; next} /^## /{in_section=0} in_section && /^([-*+]|[0-9]+[.)]) /{found=1} END{exit !found}'; then
                      echo "Release Notes section present."
                  else
                      echo "The pull request body needs a '## Release Notes' section with at least one entry ('- N/A' for non-user-facing work)."
                      exit 1
                  fi

            # Local hooks, generated CI, and template updates all consume the
            # same reviewed tool versions and archive digests.
            - name: Install tools
              run: bash scripts/install-tools

            # The prek CLI is called directly: the wrapper action logs at
            # TRACE level and buries the failing hook's output. REQUIRE_GATES
            # turns a missing linter into a failure instead of a skip.
            - name: Commit-stage checks
              env:
                  REQUIRE_GATES: "1"
              run: prek run --all-files

            # Scan exactly the commits this event introduces: the merge group
            # from its base, a push from its previous tip. Without a usable
            # base, gitleaks scans the target history and other hooks inspect all files.
            - name: Pre-push-stage checks
              env:
                  MERGE_BASE: ${{ github.event.merge_group.base_sha }}
                  MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
                  PUSH_BEFORE: ${{ github.event.before }}
                  PUSH_SHA: ${{ github.sha }}
              run: |
                  if [ -n "$MERGE_BASE" ]; then
                      from="$MERGE_BASE"
                      to="$MERGE_HEAD"
                  elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -q '^0*$'; then
                      from="$PUSH_BEFORE"
                      to="$PUSH_SHA"
                  else
                      from=""
                      to="$PUSH_SHA"
                  fi
                  if [ -n "$from" ] && git cat-file -e "$from" 2>/dev/null; then
                      prek run --stage pre-push --from-ref "$from" --to-ref "$to"
                  else
                      GITLEAKS_PUSH_TO_REF="$to" prek run --stage pre-push --all-files
                  fi
