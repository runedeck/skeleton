_subdirectory: templates/base
_answers_file: answers.yaml
# Seeded once, then owned by the consumer: a changelog, agent brief, and
# contributor guide describe that repository, not the ceremony. Copier
# never rewrites them on update, and the parity audit does not compare them.
# The spelling and Markdown lint configs join them: every consumer adds its
# own excluded fixtures and accepted words, on the same lines the template
# would edit, so a template-owned copy conflicts on each update.
_skip_if_exists:
    - CHANGELOG.md
    - AGENTS.md
    - CONTRIBUTING.md
    - INSTALL.md
    - CODEOWNERS
    - .gitignore
    - typos.toml
    - .rumdl.toml
_envops:
    variable_start_string: "${"
    variable_end_string: "}"

NAME:
    type: str
    help: Repository slug.
    default: "${_copier_conf.dst_path.name}"

TITLE:
    type: str
    help: Human-readable repository title.
    default: '${NAME | replace("-", " ") | title}'

OWNER:
    type: str
    help: GitHub owner or organization.
    default: owner

BRIEF:
    type: str
    help: One-sentence repository description.
    default: Repository scaffold.
